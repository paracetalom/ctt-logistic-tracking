services:
  db:
    image: mysql:8.0
    container_name: ctt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: ctt_logistic
      MYSQL_USER: ctt_user
      MYSQL_PASSWORD: ctt_pass123
    ports:
      - "3306:3306"
    volumes:
      - ~/projects/ctt-mysql-data:/var/lib/mysql

  web:
    build: .
    container_name: ctt-container
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db
      DB_USER: ctt_user
      DB_PASSWORD: ctt_pass123
      DB_NAME: ctt_logistic
      GEMINI_API_KEY: ${GEMINI_API_KEY}
